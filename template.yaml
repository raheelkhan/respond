AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  respond

  Respond.io DevOps Assessment
Globals:
  Function:
    LoggingConfig:
      LogFormat: JSON

Resources:
  SourceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${AWS::AccountId}-respond-io-source-bucket'

  ZipFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: zip-function/
      Handler: app.lambdaHandler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      MemorySize: 1024
      Timeout: 60
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:DeleteObject
              Resource: !Sub 'arn:${AWS::Partition}:s3:::${AWS::AccountId}-respond-io-source-bucket/incoming/*'
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub 'arn:${AWS::Partition}:s3:::${AWS::AccountId}-respond-io-source-bucket/archive/*'
      Events:
        ObjectCreated:
          Type: S3
          Properties:
            Bucket: !Ref SourceBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: incoming/
                  - Name: suffix
                    Value: .json
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - app.ts
